<script>

const matches = [

  {
    competition: "Champions League",
    team1: "Real Madrid",
    team2: "Manchester City",
    date: "22 September 2026",
    score: "2 - 1",
    player: "Kylian Mbappe",
    description: "Amazing Champions League football edit.",
    video: "https://www.youtube.com/"
  },

  {
    competition: "Premier League",
    team1: "Liverpool",
    team2: "Arsenal",
    date: "21 September 2026",
    score: "3 - 2",
    player: "Mohamed Salah",
    description: "Exciting Premier League football highlights.",
    video: "https://www.youtube.com/"
  },

  {
    competition: "La Liga",
    team1: "Barcelona",
    team2: "Real Madrid",
    date: "20 September 2026",
    score: "2 - 2",
    player: "Lamine Yamal",
    description: "El Clasico football edit.",
    video: "https://www.youtube.com/"
  }

];


const container = document.getElementById("matchContainer");


/* DISPLAY MATCHES */

function displayMatches(data) {

  container.innerHTML = "";

  if (data.length === 0) {

    container.innerHTML = `
      <div style="
        grid-column: 1/-1;
        text-align:center;
        padding:50px;
        color:#999;
      ">
        <h3>No matches found ⚽</h3>
        <p>Try searching another team, player or competition.</p>
      </div>
    `;

    return;
  }


  data.forEach(match => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="thumbnail">
        ⚽
      </div>

      <div class="card-content">

        <div class="competition">
          ${match.competition}
        </div>

        <div class="teams">
          ${match.team1} vs ${match.team2}
        </div>

        <div class="details">

          📅 ${match.date}<br>

          🏆 ${match.competition}<br>

          ⚽ Score: ${match.score}<br>

          ⭐ Player: ${match.player}

        </div>

        <p class="details">
          ${match.description}
        </p>

        <a
          href="${match.video}"
          target="_blank"
          class="btn primary"
        >
          WATCH VIDEO
        </a>

      </div>

    `;

    container.appendChild(card);

  });

}


/* SEARCH FUNCTION */

function searchMatches() {

  const searchInput =
    document.getElementById("search");

  const searchText =
    searchInput.value
      .toLowerCase()
      .trim();


  /* If search box is empty */

  if (searchText === "") {

    displayMatches(matches);

    return;

  }


  /* Search through all match information */

  const results = matches.filter(match => {

    return (

      match.team1.toLowerCase().includes(searchText) ||

      match.team2.toLowerCase().includes(searchText) ||

      match.competition.toLowerCase().includes(searchText) ||

      match.date.toLowerCase().includes(searchText) ||

      match.score.toLowerCase().includes(searchText) ||

      match.player.toLowerCase().includes(searchText) ||

      match.description.toLowerCase().includes(searchText)

    );

  });


  displayMatches(results);

}


/* CATEGORY FILTER */

function filterMatches(category) {

  document
    .querySelectorAll(".filter")
    .forEach(button =>
      button.classList.remove("active")
    );


  if (event && event.target) {
    event.target.classList.add("active");
  }


  if (category === "All") {

    displayMatches(matches);

    return;

  }


  const filtered =
    matches.filter(
      match =>
        match.competition === category
    );


  displayMatches(filtered);

}


/* SHOW ALL MATCHES WHEN WEBSITE OPENS */

displayMatches(matches);


/* ENTER KEY SEARCH */

document
  .getElementById("search")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      searchMatches();

    }

  });

</script>
